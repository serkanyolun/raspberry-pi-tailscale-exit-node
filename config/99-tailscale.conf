# Let this device forward traffic for other tailnet nodes.
# Required for exit node mode. Without this, Tailscale accepts the
# role but nothing actually routes.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# TCP BBR + fq gave a noticeably better throughput than the default
# cubic congestion control on this connection. Worth trying, not
# guaranteed to matter on every link.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Bigger socket buffers, mostly useful if you're pushing this Pi hard.
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
